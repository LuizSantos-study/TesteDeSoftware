spring.application.name=backend
server.port=8080

# Configuração do Banco de Dados PostgreSQL (Local / DBeaver)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_farmacia
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga inicial automática (src/main/resources/data.sql) executada a cada inicialização,
# somente depois que o Hibernate criar/atualizar as tabelas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Configuração do Swagger UI / OpenAPI (acesso em http://localhost:8080/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
